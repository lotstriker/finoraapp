<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Content-Security-Policy: blocks inline <script>/onerror= handlers and any script/connection
       outside this list, so even if a malicious name or CSV row slipped into the HTML it could not run.
       Allowed: own files, Google Fonts, Google sign-in (GIS) + Drive API. 'unsafe-inline' is for style="" only.
       If you ever self-host fonts or add another service, add its origin here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://*.supabase.co wss://*.supabase.co; frame-src https://accounts.google.com; object-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'" />
  <title>Finora — Personal Finance</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4A47E0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Finora" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- app.js builds the shell into <body> on load -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
